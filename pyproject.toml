[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-toolkit"
description = "翻译工具包"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aliyun-log-python-sdk>=0.9.42",
    "numpy>=2.4.1",
    "opencv-python>=4.13.0.90",
    "pillow>=11.3.0", # 处理图片的库
    "psutil>=7.2.1",
    "pydantic>=2.11.9", # 模型校验
    "pynput>=1.8.1", # 快捷键监听
    "pyperclip>=1.10.0", # 剪切板读写
    "pystray>=0.19.5", # 系统托盘创建和管理
    "requests>=2.32.5", # HTTP请求
    "sqlalchemy>=2.0.43", # 数据库读写
    "toml>=0.10.2", # toml读写
    "win11toast>=0.36.3", # 系统通知
]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "ops_toolkit.VERSION" }

[tool.setuptools.packages.find]
include = ["ops_toolkit*"]

[[tool.uv.index]]
name = "huawei"
url = "https://mirrors.huaweicloud.com/repository/pypi/simple"
default = true

[dependency-groups]
dev = [
    "ipython>=9.5.0",
    "pytest>=8.4.2",
]

[tool.setuptools.package-data]
"ops_toolkit.zhconv" = ["zhcdict.json"]
"ops_toolkit" = [
    "resources/LXGWWenKaiMono-Medium.ttf.lzma",
    "resources/app-icon.png"
]


[project.gui-scripts]
ops-toolkit = "ops_toolkit.__main__:main"

[project.scripts]
ops-toolkit-cli = "ops_toolkit.__main__:main"

[tool.uv.build-backend]
source-include = [
    "ops_toolkit/resources/*"
]
